  <script>
    // 200 dots, 20 x 10. Which dots turn green follows a fixed shuffled order (seeded); only the counts are data.
    const g = document.getElementById("c-dots");
    const NS = "http://www.w3.org/2000/svg";
    for (let i = 0; i < 200; i++) {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", 180 + (i % 20) * 44); c.setAttribute("cy", 360 + Math.floor(i / 20) * 50);
      c.setAttribute("r", 16); c.setAttribute("fill", "#c3ccd8"); c.setAttribute("class", "d");
      g.appendChild(c);
    }
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const order = [...Array(200).keys()];
    for (let i = 199; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const dots = order.map(i => g.children[i]);
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#c-title .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 0.1);
    tl.fromTo(g.children, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.004, ease: "expo.out" }, 0.3);
    tl.fromTo("#c-source", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.8);
    const green = (from, to, at, span) => tl.to(dots.slice(from, to), { attr: { fill: "#1a7f37" }, duration: 0.2, stagger: span / Math.max(1, to - from), ease: "power2.out" }, at);
    green(0, 66, 2.0, 0.8);
    green(66, 198, 4.8, 0.9);
    green(198, 200, 7.7, 0.2);
    for (const s of ["#c-step1", "#c-step2", "#c-step3"]) {
      tl.fromTo(s + " .num, " + s + " .sub, " + s + " .avg", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.08, ease: "power4.out" },
        { "#c-step1": 1.95, "#c-step2": 4.75, "#c-step3": 7.65 }[s]);
    }
    tl.to("#c-step1 > *", { opacity: 0, duration: 0.15, ease: "power3.in" }, 4.5);
    tl.to("#c-step2 > *", { opacity: 0, duration: 0.15, ease: "power3.in" }, 7.4);
    window.__timelines["crowd"] = tl;
  </script>
