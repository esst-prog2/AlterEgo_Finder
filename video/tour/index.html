<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f4f7fb; }
      #root { width: 100%; height: 100%; position: relative; background: #f4f7fb; }
      @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("assets/fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
      #logo { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
      #logo-lock { position: absolute; right: 36px; top: 24px; height: 76px; display: flex; align-items: center; gap: 12px;
        background: rgba(255,255,255,.94); border: 2px solid #1d3c78; padding: 6px 16px 6px 8px; }
      #logo-lock .mark { width: 60px; height: 60px; }
      #logo-lock span { font: 700 30px/0.9 "Barlow Condensed"; text-transform: uppercase; color: #1f2328; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="drop" data-composition-id="drop" data-composition-src="compositions/drop.html"
           data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="target" data-composition-id="target" data-composition-src="compositions/target.html"
           data-start="8" data-duration="7" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="cards" data-composition-id="cards" data-composition-src="compositions/cards.html"
           data-start="15" data-duration="6.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="local" data-composition-id="local" data-composition-src="compositions/local.html"
           data-start="21.5" data-duration="4" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
           data-start="25.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="logo" class="clip" data-start="0" data-duration="25.5" data-track-index="2" data-track-kind="graphics">
        <div id="logo-lock"><svg class="mark" viewBox="-55 -55 110 110" aria-hidden="true"><circle r="50" fill="rgba(212,167,44,.24)" stroke="#d4a72c" stroke-width="5"/><circle r="28" fill="rgba(26,127,55,.16)" stroke="#1a7f37" stroke-width="5"/><path d="M-9 0H9M0 -9V9" stroke="#1d3c78" stroke-width="5" stroke-linecap="round"/><circle cx="17" cy="-12" r="7" fill="#1a7f37"/></svg><span>AlterEgo<br />Finder</span></div>
      </div>
      <audio id="music" class="clip" src="assets/music.m4a" data-start="0" data-duration="30" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const main = gsap.timeline({ paused: true });
      main.fromTo("#logo-lock", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.3);
      main.to("#logo-lock", { opacity: 0, duration: 0.2, ease: "power3.in" }, 25.3);
      window.__timelines["main"] = main;
    </script>
  </body>
</html>
